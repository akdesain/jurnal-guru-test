<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Jurnal Mengajar & Setting</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-6xl">
        <!-- Navigasi Tab -->
        <div class="flex space-x-2 mb-6">
            <button onclick="switchTab('jurnal')" id="btn-jurnal" class="px-4 py-2 bg-blue-600 text-white rounded font-semibold">Jurnal Mengajar</button>
            <button onclick="switchTab('setting')" id="btn-setting" class="px-4 py-2 bg-gray-300 text-gray-700 rounded font-semibold">Setting Data</button>
        </div>

        <!-- TAB JURNAL -->
        <div id="tab-jurnal" class="bg-white p-6 rounded-lg shadow-md">
            <div class="mb-4 pb-4 border-b">
                <h1 class="text-2xl font-bold">REKAP JURNAL MENGAJAR (WEEKLY)</h1>
                <p class="text-sm text-gray-600 mt-1">
                    Guru Pengajar: <span id="lbl-nama" class="font-semibold">-</span> | NIP: <span id="lbl-nip" class="font-semibold">-</span>
                </p>
                <p class="text-sm text-gray-600">
                    Sekolah: <span id="lbl-sekolah" class="font-semibold">-</span>
                </p>
            </div>

            <!-- Form Tambah Jurnal -->
            <form id="form-jurnal" onsubmit="tambahJurnal(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 rounded border">
                <div>
                    <label class="block text-xs font-bold mb-1">Hari & Tanggal</label>
                    <div class="flex gap-2">
                        <select id="j-hari" class="border p-1 rounded text-sm w-1/2" required>
                            <option value="">Pilih Hari</option>
                            <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option>
                        </select>
                        <input type="date" id="j-tanggal" class="border p-1 rounded text-sm w-1/2" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Pilih Kelas</label>
                    <select id="j-kelas" class="border p-1 rounded text-sm w-full" onchange="updateJmlSiswa()" required>
                        <option value="">Pilih Kelas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Jumlah Siswa (H / S / I / A)</label>
                    <div class="grid grid-cols-4 gap-1">
                        <input type="number" id="j-hadir" placeholder="H" class="border p-1 rounded text-center text-sm" required>
                        <input type="number" id="j-sakit" placeholder="S" class="border p-1 rounded text-center text-sm" required>
                        <input type="number" id="j-izin" placeholder="I" class="border p-1 rounded text-center text-sm" required>
                        <input type="number" id="j-alpa" placeholder="A" class="border p-1 rounded text-center text-sm" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Sub Materi</label>
                    <input type="text" id="j-materi" placeholder="Sub Materi PBM" class="border p-1 rounded text-sm w-full" required>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold mb-1">Kondisi PBM</label>
                    <input type="text" id="j-kondisi" placeholder="Contoh: Kondusif, Aktif" class="border p-1 rounded text-sm w-full" required>
                </div>
                <div class="md:col-span-1 flex items-end">
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded text-sm font-bold hover:bg-green-700">Simpan Jurnal</button>
                </div>
            </form>

            <!-- Tabel Jurnal -->
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-gray-400 text-xs text-center">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border border-gray-400 p-2">HARI</th>
                            <th class="border border-gray-400 p-2">TANGGAL</th>
                            <th class="border border-gray-400 p-2">KELAS</th>
                            <th class="border border-gray-400 p-2">JML SISWA</th>
                            <th class="border border-gray-400 p-2" colspan="4">KEHADIRAN</th>
                            <th class="border border-gray-400 p-2">SUB MATERI</th>
                            <th class="border border-gray-400 p-2">KONDISI PBM</th>
                            <th class="border border-gray-400 p-2">PARAF GURU</th>
                            <th class="border border-gray-400 p-2">AKSI</th>
                        </tr>
                        <tr class="bg-gray-100">
                            <th class="border border-gray-400 p-1" colspan="4"></th>
                            <th class="border border-gray-400 p-1">HADIR</th>
                            <th class="border border-gray-400 p-1">SAKIT</th>
                            <th class="border border-gray-400 p-1">IZIN</th>
                            <th class="border border-gray-400 p-1">ALPA</th>
                            <th class="border border-gray-400 p-1" colspan="4"></th>
                        </tr>
                    </thead>
                    <tbody id="tabel-jurnal-body">
                        <!-- Data dinamis -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB SETTING -->
        <div id="tab-setting" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h1 class="text-2xl font-bold mb-4">PENGATURAN DATA & PROFIL</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Profil Guru -->
                <div class="border p-4 rounded bg-gray-50">
                    <h2 class="font-bold text-lg mb-3">Profil Guru</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-semibold">Nama Lengkap & Gelar</label>
                            <input type="text" id="set-nama" class="border p-2 rounded w-full text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold">NIP</label>
                            <input type="text" id="set-nip" class="border p-2 rounded w-full text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold">Nama Sekolah</label>
                            <input type="text" id="set-sekolah" class="border p-2 rounded w-full text-sm">
                        </div>
                        <button onclick="simpanProfil()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Simpan Profil</button>
                    </div>
                </div>

                <!-- Manajemen Kelas -->
                <div class="border p-4 rounded bg-gray-50">
                    <h2 class="font-bold text-lg mb-3">Manajemen Kelas & Jumlah Siswa</h2>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="set-namakelas" placeholder="Nama Kelas (Cth: X TKJ 1)" class="border p-2 rounded text-sm w-1/2">
                        <input type="number" id="set-jmlsiswa" placeholder="Jumlah Siswa" class="border p-2 rounded text-sm w-1/3">
                        <button onclick="tambahKelas()" class="bg-green-600 text-white px-3 py-2 rounded text-sm font-bold w-1/6">+</button>
                    </div>
                    <div class="max-h-48 overflow-y-auto border bg-white rounded p-2">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="border-b"><th>Kelas</th><th>Jml Siswa</th><th>Aksi</th></tr>
                            </thead>
                            <tbody id="tabel-kelas-body">
                                <!-- Data Kelas -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Data dari LocalStorage agar tidak hilang
        let profil = JSON.parse(localStorage.getItem('jurnal_profil')) || { nama: "Aan Kurniawan, S.Pd.,M.Ars", nip: "12321312", sekolah: "SMK Negeri 1" };
        let kelasList = JSON.parse(localStorage.getItem('jurnal_kelas')) || [
            { nama: "X TKJ 1", jumlah: 32 },
            { nama: "XI TKJ 2", jumlah: 30 }
        ];
        let jurnalList = JSON.parse(localStorage.getItem('jurnal_data')) || [];

        function switchTab(tab) {
            if(tab === 'jurnal') {
                document.getElementById('tab-jurnal').classList.remove('hidden');
                document.getElementById('tab-setting').classList.add('hidden');
                document.getElementById('btn-jurnal').className = "px-4 py-2 bg-blue-600 text-white rounded font-semibold";
                document.getElementById('btn-setting').className = "px-4 py-2 bg-gray-300 text-gray-700 rounded font-semibold";
            } else {
                document.getElementById('tab-jurnal').classList.add('hidden');
                document.getElementById('tab-setting').classList.remove('hidden');
                document.getElementById('btn-setting').className = "px-4 py-2 bg-blue-600 text-white rounded font-semibold";
                document.getElementById('btn-jurnal').className = "px-4 py-2 bg-gray-300 text-gray-700 rounded font-semibold";
            }
        }

        function renderUI() {
            // Render Profil
            document.getElementById('lbl-nama').innerText = profil.nama;
            document.getElementById('lbl-nip').innerText = profil.nip;
            document.getElementById('lbl-sekolah').innerText = profil.sekolah;

            document.getElementById('set-nama').value = profil.nama;
            document.getElementById('set-nip').value = profil.nip;
            document.getElementById('set-sekolah').value = profil.sekolah;

            // Render Dropdown Kelas & Tabel Setting Kelas
            let kelasSelect = document.getElementById('j-kelas');
            kelasSelect.innerHTML = '<option value="">Pilih Kelas</option>';
            let kelasTabelBody = document.getElementById('tabel-kelas-body');
            kelasTabelBody.innerHTML = '';

            kelasList.forEach((k, index) => {
                kelasSelect.innerHTML += `<option value="${k.nama}" data-jml="${k.jumlah}">${k.nama}</option>`;
                kelasTabelBody.innerHTML += `<tr class="border-b"><td>${k.nama}</td><td>${k.jumlah}</td><td><button onclick="hapusKelas(${index})" class="text-red-600 text-xs">Hapus</button></td></tr>`;
            });

            // Render Tabel Jurnal
            let jurnalBody = document.getElementById('tabel-jurnal-body');
            jurnalBody.innerHTML = '';
            if(jurnalList.length === 0) {
                jurnalBody.innerHTML = `<tr><td colspan="12" class="p-4 text-gray-500">Belum ada data jurnal.</td></tr>`;
            } else {
                jurnalList.forEach((j, index) => {
                    let totalSiswa = parseInt(j.hadir) + parseInt(j.sakit) + parseInt(j.izin) + parseInt(j.alpa);
                    jurnalBody.innerHTML += `
                        <tr>
                            <td class="border border-gray-400 p-2">${j.hari}</td>
                            <td class="border border-gray-400 p-2">${j.tanggal}</td>
                            <td class="border border-gray-400 p-2">${j.kelas}</td>
                            <td class="border border-gray-400 p-2 font-bold">${totalSiswa}</td>
                            <td class="border border-gray-400 p-2">${j.hadir}</td>
                            <td class="border border-gray-400 p-2">${j.sakit}</td>
                            <td class="border border-gray-400 p-2">${j.izin}</td>
                            <td class="border border-gray-400 p-2">${j.alpa}</td>
                            <td class="border border-gray-400 p-2 text-left">${j.materi}</td>
                            <td class="border border-gray-400 p-2 text-left">${j.kondisi}</td>
                            <td class="border border-gray-400 p-2">${profil.nama}</td>
                            <td class="border border-gray-400 p-2"><button onclick="hapusJurnal(${index})" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Hapus</button></td>
                        </tr>
                    `;
                });
            }
        }

        function simpanProfil() {
            profil.nama = document.getElementById('set-nama').value;
            profil.nip = document.getElementById('set-nip').value;
            profil.sekolah = document.getElementById('set-sekolah').value;
            localStorage.setItem('jurnal_profil', JSON.stringify(profil));
            renderUI();
            alert('Profil berhasil disimpan!');
        }

        function tambahKelas() {
            let nama = document.getElementById('set-namakelas').value;
            let jumlah = document.getElementById('set-jmlsiswa').value;
            if(nama && jumlah) {
                kelasList.push({ nama, jumlah });
                localStorage.setItem('jurnal_kelas', JSON.stringify(kelasList));
                document.getElementById('set-namakelas').value = '';
                document.getElementById('set-jmlsiswa').value = '';
                renderUI();
            }
        }

        function hapusKelas(index) {
            kelasList.splice(index, 1);
            localStorage.setItem('jurnal_kelas', JSON.stringify(kelasList));
            renderUI();
        }

        function updateJmlSiswa() {
            // Bisa digunakan untuk otomatisasi jika diperlukan
        }

        function tambahJurnal(e) {
            e.preventDefault();
            let newData = {
                hari: document.getElementById('j-hari').value,
                tanggal: document.getElementById('j-tanggal').value,
                kelas: document.getElementById('j-kelas').value,
                hadir: document.getElementById('j-hadir').value,
                sakit: document.getElementById('j-sakit').value,
                izin: document.getElementById('j-izin').value,
                alpa: document.getElementById('j-alpa').value,
                materi: document.getElementById('j-materi').value,
                kondisi: document.getElementById('j-kondisi').value
            };
            jurnalList.push(newData);
            localStorage.setItem('jurnal_data', JSON.stringify(jurnalList));
            document.getElementById('form-jurnal').reset();
            renderUI();
        }

        function hapusJurnal(index) {
            jurnalList.splice(index, 1);
            localStorage.setItem('jurnal_data', JSON.stringify(jurnalList));
            renderUI();
        }

        // Jalankan saat pertama load
        renderUI();
    </script>
</body>
</html>
